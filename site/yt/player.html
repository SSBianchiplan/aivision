<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Player do YouTube em janela própria — o caminho do Safari, do Firefox e de todo
  navegador sem iframe «credentialless» (ver js/camera/youtube-janela.js).

  Esta página é servida SEM os cabeçalhos de isolamento (COOP/COEP/CORP): o Caddy
  os retira em /yt/*. Assim o embed normal do YouTube carrega aqui, coisa que a
  página do app (isolada, por causa das threads do ONNX) não consegue fora do
  Chrome/Edge. Ela não importa nada do app — só o player oficial — e é comandada
  pelo app por BroadcastChannel (mesma origem; funciona mesmo com o COOP do app
  cortando o vínculo com a janela que ele abriu).

  O YouTube exige o Referer no embed (erro 153 sem ele); o site manda
  «Referrer-Policy: no-referrer», então a política desta página é trocada aqui.
-->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="dark">
<title>Player do YouTube — iaVision</title>
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player, #player iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
  /* aviso discreto só enquanto não há vídeo (some quando o player aparece) */
  #espera { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
            color: #8a8a8a; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  #espera[hidden] { display: none; }
  #espera b { color: #cfcfcf; font-weight: 600; }
</style>
</head>
<body>
<div id="player"></div>
<div id="espera">Aguardando o vídeo do <b>GPlanSiS|iaVision</b>…</div>
<script src="player.js?v=1"></script>
</body>
</html>
